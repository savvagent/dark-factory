# Fly.io config for the dark-factory MCP server, org "savvagent".
#
# Database: a dedicated `dark_factory` database + `dark-factory` schema_admin
# role on the shared `savvagent-pg` managed Postgres cluster (kyzl60xmdjxopj9g),
# isolated from the `light_factory` / nels-api databases on the same cluster.
# DATABASE_URL is already staged as a secret via `fly mpg attach`.
#
# TODO(task 13): this cannot deploy successfully until df-server actually
# binds DF_BIND, serves /healthz + /readyz, and runs migrations under an
# advisory lock at startup. Until then, treat this file as the target shape,
# not a working deploy.

app = "dark-factory-mcp"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DF_BIND = "0.0.0.0:8080"
  DF_PUBLIC_URL = "https://dark-factory-mcp.fly.dev"
  DF_RESOURCE_URI = "https://dark-factory-mcp.fly.dev/mcp"
  RUST_LOG = "info,df_server=info,df_mcp=info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/readyz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
