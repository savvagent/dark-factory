# Fly.io config for the dark-factory MCP server, org "savvagent".
#
# Database: a dedicated `dark_factory` database + `dark-factory` schema_admin
# role on the shared `savvagent-pg` managed Postgres cluster (kyzl60xmdjxopj9g),
# isolated from the `light_factory` / nels-api databases on the same cluster.
# DATABASE_URL is already staged as a secret via `fly mpg attach`.
#
# df-server now binds DF_BIND, serves /healthz + /readyz, and runs migrations
# under an advisory lock at startup (see docs/deploy/fly.md), so this file
# describes a working deploy target — the first `fly deploy` itself is still a
# deliberate, separate step.

app = "dark-factory-mcp"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DF_BIND = "0.0.0.0:8080"
  DF_PUBLIC_URL = "https://dark-factory-mcp.fly.dev"
  DF_RESOURCE_URI = "https://dark-factory-mcp.fly.dev/mcp"
  # Every request reaching this process has already passed through Fly's edge
  # proxy, which appends the real client address to X-Forwarded-For rather
  # than trusting whatever a caller sent — it is safe to read here. Without
  # this, every request behind Fly carries one shared ConnectInfo address, and
  # df-auth's per-source throttles (signup, magic links, client registration)
  # key every caller in the world into that one bucket.
  DF_TRUST_FORWARDED_FOR = "1"
  # No SMTP/mail-provider integration exists yet (milestone 1 scope); df-server
  # refuses to start without this explicit opt-in to running with LogMailer.
  # At this RUST_LOG level LogMailer only logs recipient+subject (see
  # crates/df-web/src/mail.rs) — verification/recovery/invitation links are
  # NOT delivered and are not even visible in these logs. A deploy today is
  # API-only usable until a real mailer replaces this.
  DF_ALLOW_LOG_MAILER = "1"
  RUST_LOG = "info,df_server=info,df_mcp=info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/readyz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
