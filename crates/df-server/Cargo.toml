[package]
name = "df-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# A library as well as a binary, so the router assembly is reachable from an
# integration test. A `main.rs` that can only be exercised by starting a process
# is a `main.rs` whose route collisions are found by a deployment.
[lib]
name = "df_server"
path = "src/lib.rs"

[[bin]]
name = "df-server"
path = "src/main.rs"

[dependencies]
df-core.workspace = true
df-auth.workspace = true
df-mcp.workspace = true
df-billing.workspace = true
df-trackers.workspace = true
df-web.workspace = true
sqlx.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
http.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
dotenvy.workspace = true

[dev-dependencies]
df-core.workspace = true
df-auth.workspace = true
